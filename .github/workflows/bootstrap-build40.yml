name: Bootstrap NEW from FOX Build 40

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEW
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace NEW with exact FOX Build 40 snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="ca6a3be30168675a36d9c16acb74e281ac2c33e9"
          git clone --quiet https://github.com/abdrrahmaneabou-oss/FOX.git /tmp/fox40
          git -C /tmp/fox40 checkout --quiet "$SOURCE_SHA"
          rsync -a --delete --exclude='.git' /tmp/fox40/ "$GITHUB_WORKSPACE/"
          test -f .github/workflows/build-fox.yml
          test -f FOX_AWG_Experimental.apk
          printf '%s\n' "$SOURCE_SHA" > BUILD40_SOURCE_COMMIT.txt
          git config user.name "CHATGPT"
          git config user.email "abdrrahmaneabou@gmail.com"
          git add -A
          git commit -m "Reset NEW to exact FOX Build #40 snapshot"
          git push origin HEAD:main
